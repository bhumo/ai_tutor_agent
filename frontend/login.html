<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Tutor - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .auth-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 2rem;
            width: 100%;
            max-width: 400px;
        }
        
        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .auth-header h2 {
            color: #333;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        
        .auth-header p {
            color: #666;
            margin: 0;
        }
        
        .form-control {
            border-radius: 10px;
            border: 2px solid #e9ecef;
            padding: 12px 15px;
            margin-bottom: 1rem;
        }
        
        .form-control:focus {
            border-color: #667eea;
            box-shadow: none;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
            width: 100%;
        }
        
        .auth-switch {
            text-align: center;
            margin-top: 1.5rem;
        }
        
        .auth-switch a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        
        .alert {
            border-radius: 10px;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Welcome Back!</h2>
                <p>Sign in to your AI Tutor account</p>
            </div>
            
            <div id="alert-container"></div>
            
            <!-- Email/Password Form -->
            <form id="loginForm">
                <div class="mb-3">
                    <input type="email" class="form-control" id="email" placeholder="Email address" required>
                </div>
                <div class="mb-3">
                    <input type="password" class="form-control" id="password" placeholder="Password" required>
                </div>
                <button type="submit" class="btn btn-primary">
                    Sign In
                </button>
            </form>
            
            <div class="auth-switch">
                Don't have an account? <a href="#" onclick="showRegister()">Sign up</a>
            </div>
        </div>
    </div>
    
    <!-- Register Form (Hidden by default) -->
    <div class="auth-container" id="registerContainer" style="display: none;">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Create Account</h2>
                <p>Join AI Tutor to start learning</p>
            </div>
            
            <div id="register-alert-container"></div>
            
            <!-- Registration Form -->
            <form id="registerForm">
                <div class="mb-3">
                    <input type="text" class="form-control" id="fullName" placeholder="Full Name (optional)">
                </div>
                <div class="mb-3">
                    <input type="email" class="form-control" id="registerEmail" placeholder="Email address" required>
                </div>
                <div class="mb-3">
                    <input type="password" class="form-control" id="registerPassword" placeholder="Password" required>
                </div>
                <button type="submit" class="btn btn-primary">
                    Create Account
                </button>
            </form>
            
            <div class="auth-switch">
                Already have an account? <a href="#" onclick="showLogin()">Sign in</a>
            </div>
        </div>
    </div>

    <script>
        // Show/Hide forms
        function showRegister() {
            document.querySelector('.auth-container').style.display = 'none';
            document.getElementById('registerContainer').style.display = 'flex';
        }
        
        function showLogin() {
            document.querySelector('.auth-container').style.display = 'flex';
            document.getElementById('registerContainer').style.display = 'none';
        }
        
        // Show alerts
        function showAlert(message, type = 'danger', container = 'alert-container') {
            const alertHtml = `
                <div class="alert alert-${type} alert-dismissible fade show" role="alert">
                    ${message}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            `;
            document.getElementById(container).innerHTML = alertHtml;
        }
        
        // Login form handler
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    localStorage.setItem('token', data.access_token);
                    window.location.href = '/';
                } else {
                    showAlert(data.detail || 'Login failed');
                }
            } catch (error) {
                showAlert('Network error. Please try again.');
            }
        });
        
        // Register form handler
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const full_name = document.getElementById('fullName').value;
            
            try {
                const response = await fetch('/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ 
                        email, 
                        password,
                        full_name: full_name || null
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showAlert('Account created successfully! Please sign in.', 'success', 'register-alert-container');
                    setTimeout(() => showLogin(), 2000);
                } else {
                    showAlert(data.detail || 'Registration failed', 'danger', 'register-alert-container');
                }
            } catch (error) {
                showAlert('Network error. Please try again.', 'danger', 'register-alert-container');
            }
        });
        
        // Check if user is already logged in
        if (localStorage.getItem('token')) {
            window.location.href = '/';
        }
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
