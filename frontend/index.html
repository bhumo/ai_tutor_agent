<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Tutor Chat</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <!-- Markdown Parser -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Sanitize model-generated HTML before inserting it into the page -->
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script>

  <style>
    body {
      background-color: #f0f2f5;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    .navbar {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 1rem 0;
    }

    .navbar-brand {
      font-weight: 600;
      font-size: 1.2rem;
    }

    .user-info {
      color: white;
      margin-right: 1rem;
    }

    .btn-logout {
      background: rgba(255, 255, 255, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      border-radius: 20px;
      padding: 0.375rem 1rem;
    }

    .btn-logout:hover {
      background: rgba(255, 255, 255, 0.3);
      color: white;
    }

    .main-content {
      padding-top: 20px;
    }

    .chat-container {
      max-width: 700px;
      height: 70vh;
      margin: auto;
      background-color: white;
      border-radius: 12px;
      padding: 20px;
      overflow-y: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
    }

    .message-wrapper {
      display: flex;
      margin-bottom: 15px;
    }

    .bot-wrapper {
      flex-direction: row;
      align-items: flex-start;
    }

    .user-wrapper {
      flex-direction: row-reverse;
      align-items: flex-end;
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 10px;
    }

    .message {
      padding: 12px 18px;
      border-radius: 20px;
      max-width: 75%;
      word-wrap: break-word;
      line-height: 1.5;
      animation: fadeIn 0.3s ease-in-out;
    }

    .user-message {
      background-color: #d0e6ff;
    }

    .bot-message {
      background-color: #eaeaea;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .bot-message pre {
      background: #f6f8fa;
      padding: 10px;
      border-radius: 8px;
      overflow-x: auto;
    }

    .bot-message code {
      background: #f0f0f0;
      padding: 2px 4px;
      border-radius: 4px;
      font-family: monospace;
    }

    .input-area {
      max-width: 700px;
      margin: 20px auto;
    }

    .form-control {
      border-radius: 20px;
      padding: 12px;
    }

    .btn {
      border-radius: 20px;
    }

    .loader {
      display: flex;
      align-items: center;
      gap: 10px;
    }
  </style>
</head>
<body>
  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand text-white" href="#">
        <i class="fas fa-graduation-cap me-2"></i>
        AI Tutor
      </a>
      <div class="d-flex align-items-center">
        <div class="user-info d-none" id="userInfo">
          <span id="userName">Loading...</span>
        </div>
        <button class="btn btn-logout" onclick="logout()">
          <i class="fas fa-sign-out-alt me-1"></i>
          Logout
        </button>
      </div>
    </div>
  </nav>

  <div class="main-content">
    <div class="chat-container" id="chatBox">
      <div class="message-wrapper bot-wrapper">
        <img src="https://cdn-icons-png.flaticon.com/512/4712/4712100.png" alt="Tutor" class="avatar" />
        <div class="message bot-message">
          Hi! I'm your AI Tutor. Ask me about <strong>math, physics, chemistry, biology,</strong> or <strong>computer science</strong>.
        </div>
      </div>
    </div>
  </div>

  <div class="input-area px-3">
    <div class="input-group">
      <input type="text" class="form-control" id="userInput" placeholder="Type your question...">
      <button class="btn btn-primary ms-2" onclick="sendMessage()">Send</button>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const input = document.getElementById("userInput");
    const chatBox = document.getElementById("chatBox");
    const userInfo = document.getElementById("userInfo");
    const userName = document.getElementById("userName");
    let loaderElem = null;
    let currentUser = null;
    let currentSessionId = localStorage.getItem('activeSessionId');

    // Check authentication on page load
    window.addEventListener('load', async () => {
      const token = localStorage.getItem('token');
      if (!token) {
        window.location.href = '/static/login.html';
        return;
      }

      // Verify token and get user info
      try {
        const response = await fetch('/auth/me', {
          method: 'GET',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          }
        });

        if (response.ok) {
          currentUser = await response.json();
          userName.textContent = currentUser.full_name || currentUser.email;
          userInfo.classList.remove('d-none');
        } else {
          localStorage.removeItem('token');
          window.location.href = '/static/login.html';
        }
      } catch (error) {
        localStorage.removeItem('token');
        window.location.href = '/static/login.html';
      }
    });

    // Logout function
    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('activeSessionId');
      window.location.href = '/static/login.html';
    }

    async function sendMessage() {
      const message = input.value.trim();
      if (!message) return;

      const token = localStorage.getItem('token');
      if (!token) {
        window.location.href = '/static/login.html';
        return;
      }

      // User message
      const userWrapper = document.createElement("div");
      userWrapper.className = "message-wrapper user-wrapper";

      const userAvatar = document.createElement("img");
      userAvatar.src = currentUser?.profile_picture || "https://cdn-icons-png.flaticon.com/512/1077/1077063.png";
      userAvatar.className = "avatar";

      const userMessage = document.createElement("div");
      userMessage.className = "message user-message";
      userMessage.textContent = message;

      userWrapper.appendChild(userAvatar);
      userWrapper.appendChild(userMessage);
      chatBox.appendChild(userWrapper);
      chatBox.scrollTop = chatBox.scrollHeight;
      input.value = "";

      // Add loader
      loaderElem = document.createElement("div");
      loaderElem.className = "message-wrapper bot-wrapper";
      loaderElem.innerHTML = `
        <img src="https://cdn-icons-png.flaticon.com/512/4712/4712100.png" class="avatar" />
        <div class="message bot-message loader">
          <div class="spinner-border text-secondary spinner-border-sm" role="status"></div>
          <span>Thinking...</span>
        </div>`;
      chatBox.appendChild(loaderElem);
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`
          },
          body: JSON.stringify({ message: message, session_id: currentSessionId })
        });

        const data = await response.json();

        if (response.status === 401 || response.status === 403) {
          localStorage.removeItem('token');
          window.location.href = '/static/login.html';
          return;
        }

        if (loaderElem) loaderElem.remove();

        if (!response.ok) {
          if (response.status === 404 && currentSessionId) {
            localStorage.removeItem('activeSessionId');
            currentSessionId = null;
          }
          throw new Error(data.detail || "Tutor request failed");
        }

        currentSessionId = data.session_id;
        localStorage.setItem('activeSessionId', currentSessionId);

        const botWrapper = document.createElement("div");
        botWrapper.className = "message-wrapper bot-wrapper";

        const botAvatar = document.createElement("img");
        botAvatar.src = "https://cdn-icons-png.flaticon.com/512/4712/4712100.png";
        botAvatar.className = "avatar";

        const botMessage = document.createElement("div");
        botMessage.className = "message bot-message";
        botMessage.innerHTML = DOMPurify.sanitize(marked.parse(data.response));

        botWrapper.appendChild(botAvatar);
        botWrapper.appendChild(botMessage);
        chatBox.appendChild(botWrapper);
        chatBox.scrollTop = chatBox.scrollHeight;
      } catch (error) {
        if (loaderElem) loaderElem.remove();
        const errorWrapper = document.createElement("div");
        errorWrapper.className = "message-wrapper bot-wrapper";

        const errorAvatar = document.createElement("img");
        errorAvatar.src = "https://cdn-icons-png.flaticon.com/512/4712/4712100.png";
        errorAvatar.className = "avatar";

        const errorMessage = document.createElement("div");
        errorMessage.className = "message bot-message";
        errorMessage.textContent = "Sorry, there was an error contacting the server.";

        errorWrapper.appendChild(errorAvatar);
        errorWrapper.appendChild(errorMessage);
        chatBox.appendChild(errorWrapper);
        chatBox.scrollTop = chatBox.scrollHeight;
      }
    }

    input.addEventListener("keydown", function (event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });
  </script>

</body>
</html>
